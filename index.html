<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pirateship</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Cardo:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link href="style.css" rel="stylesheet" type="text/css">
</head>
<body>

<!-- Parallax ocean layers -->
<div class="parallax-bg">
  <div class="para-stars"  data-speed="0.15"></div>
  <div class="para-fog"    data-speed="0.3"></div>
  <div class="para-clouds" data-speed="0.45"></div>
</div>

<!-- Fixed wave strip at bottom -->
<div class="ocean-bottom">
  <div class="wave wave1"></div>
  <div class="wave wave2"></div>
  <div class="wave wave3"></div>
</div>

<!-- Info modal -->
<div class="modal-overlay" id="modal-overlay" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true">
    <button class="modal-close" id="modal-close" aria-label="Close">✕</button>
    <div class="modal-icon" id="modal-icon"></div>
    <h2 class="modal-title" id="modal-title"></h2>
    <p class="modal-desc" id="modal-desc"></p>
    <div class="modal-info" id="modal-info"></div>
    <div class="modal-actions">
      <a class="modal-btn-main" id="modal-link-main" href="#" target="_self">Open</a>
      <a class="modal-btn-tab"  id="modal-link-tab"  href="#" target="_blank" rel="noopener">↗ New tab</a>
    </div>
  </div>
</div>

<div id="wrapper">
  <header>
    <div class="skull">☠</div>
    <h1>PIRATESHIP</h1>
    <p class="tagline">Your treasure map to the seas</p>
  </header>

  <main>
    <!-- WEBSITES -->
    <section class="category">
      <h3 class="category-label">— Websites —</h3>
      <div class="grid">

        <!--
          CARD TEMPLATE — copy this block to add a site.
          data-info: pipe-separated bullet points shown in the modal.
          data-desc: one-line description in the modal.
        -->
        <div class="card-wrap"
             data-href="https://plex.pirateship.uk"
             data-title="Plex"
             data-icon="🎬"
             data-desc="Stream your personal media library from anywhere."
             data-info="Movies & TV shows|Request new content via Overseerr|4K and HDR supported|Login with your Plex account">
          <button class="box" aria-label="Plex — info">
            <span class="nail-l"></span><span class="nail-r"></span>
            <div class="box-icon">🎬</div>
            <h2>Plex</h2>
            <p>Movies &amp; TV shows</p>
          </button>
          <div class="card-footer">
            <a class="card-open" href="https://plex.pirateship.uk">Open</a>
            <a class="card-tab"  href="https://plex.pirateship.uk" target="_blank" rel="noopener">↗</a>
          </div>
        </div>

        <div class="card-wrap"
             data-href="https://audio.pirateship.uk"
             data-title="Audiobookshelf"
             data-icon="🎧"
             data-desc="Your personal audiobook and podcast server."
             data-info="Audiobooks & podcasts|Track your listening progress|Offline downloads supported|Login with your account">
          <button class="box" aria-label="Audiobookshelf — info">
            <span class="nail-l"></span><span class="nail-r"></span>
            <div class="box-icon">🎧</div>
            <h2>Audiobookshelf</h2>
            <p>Audiobooks &amp; podcasts</p>
          </button>
          <div class="card-footer">
            <a class="card-open" href="https://audio.pirateship.uk">Open</a>
            <a class="card-tab"  href="https://audio.pirateship.uk" target="_blank" rel="noopener">↗</a>
          </div>
        </div>

        <!-- ADD MORE: copy a card-wrap block above; update data-* attrs, href, icon, h2, p -->
        <div class="card-wrap card-wrap--add">
          <button class="box box--add" disabled>
            <div class="box-icon">＋</div>
            <h2>Add Site</h2>
            <p>Edit index.html</p>
          </button>
        </div>

      </div>
    </section>

    <!-- TOOLS -->
    <section class="category">
      <h3 class="category-label">— Tools —</h3>
      <div class="grid">

        <div class="card-wrap card-wrap--add">
          <button class="box box--add" disabled>
            <div class="box-icon">＋</div>
            <h2>Add Site</h2>
            <p>Edit index.html</p>
          </button>
        </div>

        <div class="card-wrap card-wrap--add">
          <button class="box box--add" disabled>
            <div class="box-icon">＋</div>
            <h2>Add Site</h2>
            <p>Edit index.html</p>
          </button>
        </div>

        <div class="card-wrap card-wrap--add">
          <button class="box box--add" disabled>
            <div class="box-icon">＋</div>
            <h2>Add Site</h2>
            <p>Edit index.html</p>
          </button>
        </div>

      </div>
    </section>
  </main>

  <footer>
    <p>⚓ pirateship.uk</p>
  </footer>
</div>

<script>
  /* ── Parallax ── */
  const layers = document.querySelectorAll('[data-speed]');
  window.addEventListener('scroll', () => {
    const sy = window.scrollY;
    layers.forEach(el => {
      el.style.transform = `translateY(${sy * parseFloat(el.dataset.speed)}px)`;
    });
  }, { passive: true });

  /* ── Info modal ── */
  const overlay   = document.getElementById('modal-overlay');
  const modalClose= document.getElementById('modal-close');
  const mIcon     = document.getElementById('modal-icon');
  const mTitle    = document.getElementById('modal-title');
  const mDesc     = document.getElementById('modal-desc');
  const mInfo     = document.getElementById('modal-info');
  const mLinkMain = document.getElementById('modal-link-main');
  const mLinkTab  = document.getElementById('modal-link-tab');

  function openModal(card) {
    const href  = card.dataset.href;
    const title = card.dataset.title;
    const icon  = card.dataset.icon;
    const desc  = card.dataset.desc  || '';
    const info  = card.dataset.info  || '';

    mIcon.textContent  = icon;
    mTitle.textContent = title;
    mDesc.textContent  = desc;
    mLinkMain.href     = href;
    mLinkTab.href      = href;

    mInfo.innerHTML = info
      ? info.split('|').map(s => `<span class="modal-bullet">⚓ ${s.trim()}</span>`).join('')
      : '';

    overlay.setAttribute('aria-hidden', 'false');
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    modalClose.focus();
  }

  function closeModal() {
    overlay.classList.remove('open');
    overlay.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }

  // clicking the card tile opens the modal
  document.querySelectorAll('.card-wrap:not(.card-wrap--add) .box').forEach(btn => {
    btn.addEventListener('click', () => openModal(btn.closest('.card-wrap')));
  });

  modalClose.addEventListener('click', closeModal);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
</body>
</html>
